[package]
name = "motion-studio-local"
version = "0.1.0"
description = "Motion Studio: a personal, local-first screen recorder with auto cursor zoom"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "motion_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "fs"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

# Linux/BSD cursor sampling. `x11-dl` loads libX11 at runtime (dlopen), so the
# build needs no X11 headers and the binary still starts on a Wayland-only
# machine — there we report cursor sampling as unavailable with a reason.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2.21"
# Native screen capture. The webview cannot capture here: WebKitGTK's display
# track encodes to zero frames, and its frames read back black through both a 2D
# canvas and WebGL, measured on real hardware. `ashpd` asks xdg-desktop-portal
# for a ScreenCast session over D-Bus (pure Rust, through zbus) and `pipewire`
# reads the frames the portal hands back; they go to the ffmpeg this app already
# requires. See src/native_capture.rs.
#
# Building `pipewire` needs the PipeWire headers: `sudo apt install
# libpipewire-0.3-dev` on Debian/Ubuntu. Linux/BSD only, so Windows and macOS
# builds are untouched.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt", "time", "net"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
